[project]
name = "tareas"
version = "1.0.0"
description = "Automatiza tareas repetitivas con ficheros desde la terminal"
readme = "README.md"
authors = [
    { name = "GranOsoPelutiLletx", email = "338292217+JuanMTF@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.0",
    "httpx>=0.28.1",
    "psutil>=7.2.2",
    "pymupdf>=2.1",
    "python-dotenv>=1.2.4",
    "typer>=0.27.3",    #tu version puede ser otra: la pone uv add
]

[project.scripts]
cliWork = "tareas.cli:app" # nombre del programa: cliWork ejecutar abrir-nav

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
# Temporal propio: el árbol numerado de Windows (pytest-of-<usuario>/pytest-current)
# queda con ACLs podadas y pytest se cae AL FINAL (todos los tests en verde) en
# cleanup_dead_symlinks. Con --basetemp no hay directorios numerados ni enlace,
# y pytest borra este directorio al empezar cada sesión.
addopts = "--basetemp=.pytest-tmp"
