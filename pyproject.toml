[project]
name = "tareas"
version = "0.1.0"
description = "Automatiza tareas repetitivas con ficheros desde la terminal"
readme = "README.md"
authors = [
    { name = "GranOsoPelutiLletx", email = "338292217+JuanMTF@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.27.3",    #tu version puede ser otra: la pone uv add
]

[project.scripts]
tareas = "tareas.cli:app" # Antes ponía: tareas = "tareas:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
